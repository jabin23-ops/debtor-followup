<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Debtor Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  /* warm calm light theme */
  --bg:#FAF7F2;          /* page background — warm cream */
  --bg2:#F2EDE3;         /* header band — soft beige */
  --bg3:#E6DCC6;         /* active pill / detail boxes — darker beige */
  --card:#FFFFFF;        /* card surface — paper white */
  --border:rgba(139,110,86,0.18);
  --text:#2D2419;        /* warm dark brown */
  --muted:#8B7A65;       /* warm gray-brown */
  --soft:#F7F3EA;        /* very soft warm tint for inner panels */

  --overdue:#C44536;
  --overdue-bg:rgba(196,69,54,0.10);
  --due:#D88C3F;
  --due-bg:rgba(216,140,63,0.13);
  --coming:#B8902E;
  --coming-bg:rgba(184,144,46,0.13);
  --current:#5A9577;
  --current-bg:rgba(90,149,119,0.14);
  --bad:#8B7E70;
  --bad-bg:rgba(139,126,112,0.12);
  --sister:#8E76A0;
  --sister-bg:rgba(142,118,160,0.12);
  --stale:#A8628A;
  --pdc:#2B6CB0; --pdc-bg:rgba(43,108,176,0.1);
  --stale-bg:rgba(168,98,138,0.13);

  --pdc:#5A8F73;
  --azaiba:#5577A8;
  --national:#C8772F;
  --green:#5A9577;
  --green-bg:rgba(90,149,119,0.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;min-height:100vh}
.wrap{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}

/* HEADER */
.hdr{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 14px 8px;position:sticky;top:0;z-index:100}
.hdr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hdr-title{font-size:15px;font-weight:700;letter-spacing:-0.3px;color:var(--text)}
.hdr-title span{color:var(--muted);font-weight:400;font-size:12px;margin-left:5px}
.updated{font-size:10px;color:var(--muted)}
.filter-row{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-bottom:6px}
.filter-row-dd{display:flex;gap:8px;margin-bottom:6px;overflow:visible;position:relative}
.filter-row::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:20px;padding:5px 12px;font-size:11px;cursor:pointer;white-space:nowrap;font-family:inherit;font-weight:500;transition:all 0.15s}
.pill:hover{border-color:var(--text)}
.pill.active{color:#fff;border-color:transparent;font-weight:700}
.pill.active.all{background:var(--text);color:#FFF}
.pill.active.ov{background:var(--overdue)}
.pill.active.due{background:var(--due)}
.pill.active.com{background:var(--coming)}
.pill.active.cur{background:var(--current)}
.pill.active.az{background:rgba(85,119,168,0.18);color:var(--azaiba);border-color:var(--azaiba)}
.pill.active.nat{background:rgba(200,119,47,0.16);color:var(--national);border-color:var(--national)}
.pill.active.seg{background:var(--text);color:#FFF}
.pill.t5{border-color:var(--current);color:var(--current);background:var(--current-bg)}
.pill.t5.active{background:var(--current);color:#fff;border-color:var(--current)}
.pill.stale{border-color:var(--stale);color:var(--stale);background:var(--stale-bg)}
.pill.stale.active{background:var(--stale);color:#fff;border-color:var(--stale)}
.pill.pdc{border-color:var(--pdc);color:var(--pdc);background:var(--pdc-bg)}
.pill.pdc.active{background:var(--pdc);color:#fff;border-color:var(--pdc)}
.pill.collect{border-color:#E65100;color:#E65100;background:#FFF3E0}
.pill.collect.active{background:#E65100;color:#fff;border-color:#E65100}
.pill.snoozed{border-color:#7B4E8C;color:#7B4E8C;background:rgba(123,78,140,0.13)}
.pill.snoozed.active{background:#7B4E8C;color:#fff;border-color:#7B4E8C}
.fu-snooze-chip{font-size:10px;font-weight:700;color:#7B4E8C;background:rgba(123,78,140,0.13);border-radius:20px;padding:2px 8px;margin-top:4px;display:inline-block}
.fu-promise-chip{font-size:10px;font-weight:700;color:#92400E;background:rgba(146,64,14,0.10);border-radius:20px;padding:2px 8px;margin-top:4px;display:inline-block}
.dd-wrap{position:relative;display:inline-block;z-index:auto}
.dd-trigger{font-size:12px;font-weight:600;padding:9px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;-webkit-tap-highlight-color:rgba(0,0,0,0.05);touch-action:manipulation}
.dd-trigger.active{background:var(--text);color:var(--card);border-color:var(--text)}
.dd-trigger .caret{font-size:8px;opacity:0.7}
.dd-menu{position:absolute;top:calc(100% + 4px);left:0;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,0.18);min-width:180px;z-index:9999;display:none;padding:6px;max-height:70vh;overflow-y:auto}
.dd-menu.open{display:block}
.dd-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;font-size:12px;font-weight:500;color:var(--text);background:transparent;border:none;border-radius:6px;cursor:pointer;width:100%;text-align:left;white-space:nowrap}
.dd-item:hover{background:var(--soft)}
.dd-item.selected{background:var(--soft);font-weight:700}
.dd-item .ddi-count{font-size:10px;color:var(--muted);font-weight:600}
.dd-section{font-size:9px;text-transform:uppercase;letter-spacing:0.6px;color:var(--muted);padding:6px 11px 3px;font-weight:600}
.dd-divider{height:1px;background:var(--border);margin:4px 0}
.fu-snooze-preset{font-size:11px;font-weight:600;padding:6px 10px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;margin-right:4px}
.fu-snooze-preset.selected{background:#7B4E8C;color:#fff;border-color:#7B4E8C}
.fu-unsnooze-btn{font-size:11px;font-weight:600;padding:6px 10px;border-radius:18px;border:1px solid #7B4E8C;color:#7B4E8C;background:rgba(123,78,140,0.08);cursor:pointer;margin-top:6px}
.fu-collect-chip{font-size:10px;font-weight:700;color:#E65100;background:#FFF3E0;border-radius:20px;padding:2px 8px;margin-top:4px;display:inline-block}
.fu-count{font-weight:600;opacity:0.85;margin-left:2px}

/* KPI */
.kpi-strip{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:10px 14px}
.kpi{background:var(--card);border-radius:10px;padding:10px 12px;border:1px solid var(--border);box-shadow:0 1px 2px rgba(139,110,86,0.05)}
.kpi-l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:3px}
.kpi-v{font-size:18px;font-weight:800;letter-spacing:-0.5px;color:var(--text)}
.kpi-v.red{color:var(--overdue)}.kpi-v.ora{color:var(--due)}.kpi-v.yel{color:var(--coming)}.kpi-v.wh{color:var(--text)}

/* SECTIONS */
.sec-hdr{padding:8px 14px 3px;font-size:9px;text-transform:uppercase;letter-spacing:0.7px;color:var(--muted);border-top:1px solid var(--border);margin-top:3px;display:flex;justify-content:space-between;background:var(--soft)}
.sec-hdr span{font-size:11px;font-weight:700;color:var(--text)}
.cards{padding:6px 10px;display:flex;flex-direction:column;gap:7px;background:var(--soft)}

/* CARD */
.card{background:var(--card);border-radius:12px;border:1px solid var(--border);overflow:hidden;box-shadow:0 1px 3px rgba(139,110,86,0.07)}
.card-head{padding:12px 13px;cursor:pointer;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.card-left{flex:1;min-width:0}
.card-tags{display:flex;gap:4px;align-items:center;margin-bottom:5px;flex-wrap:wrap}
.badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;letter-spacing:0.3px;text-transform:uppercase}
.OVERDUE{background:var(--overdue-bg);color:var(--overdue)}
.DUE{background:var(--due-bg);color:var(--due)}
.COMING{background:var(--coming-bg);color:var(--coming)}
.CURRENT{background:var(--current-bg);color:var(--current)}
.BADDEBT,.COURTCASE{background:var(--bad-bg);color:var(--bad)}
.SISTER{background:var(--sister-bg);color:var(--sister)}
.co-AZAIBA{font-size:9px;padding:2px 6px;border-radius:20px;font-weight:600;background:rgba(85,119,168,0.13);color:var(--azaiba)}
.co-NATIONAL{font-size:9px;padding:2px 6px;border-radius:20px;font-weight:600;background:rgba(200,119,47,0.13);color:var(--national)}
.pdc-tag{font-size:9px;padding:2px 6px;border-radius:20px;font-weight:600;background:rgba(90,143,115,0.13);color:var(--pdc)}
.card-name{font-size:13.5px;font-weight:600;line-height:1.3;word-break:break-word;color:var(--text)}
.card-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.card-amt{font-size:16px;font-weight:800;letter-spacing:-0.5px}
.card-sub{font-size:9px;color:var(--muted)}
.chev{color:var(--muted);font-size:14px;margin-top:2px;transition:transform 0.2s;display:inline-block}
.card.open .chev{transform:rotate(180deg)}

/* DETAIL */
.card-detail{display:none;border-top:1px solid var(--border);padding:0 13px 12px;background:var(--soft)}
.card.open .card-detail{display:block}
.det-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.det-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
.det-box{background:var(--card);border-radius:8px;padding:8px 8px;text-align:center;border:1px solid var(--border)}
.det-box .dl{font-size:9px;color:var(--muted);margin-bottom:2px;text-transform:uppercase;letter-spacing:0.4px}
.det-box .dv{font-size:12px;font-weight:700;color:var(--text)}
.dv.ov{color:var(--overdue)}.dv.du{color:var(--due)}.dv.co{color:var(--coming)}
.dv.pd{color:var(--pdc)}.dv.gr{color:var(--current)}

/* credit / pdc info strip */
.info-strip{display:flex;gap:6px;margin:8px 0}
.info-chip{flex:1;background:var(--card);border-radius:8px;padding:7px 9px;display:flex;align-items:center;gap:6px;border:1px solid var(--border)}
.info-chip .ic-icon{font-size:13px}
.info-chip .ic-body .ic-label{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px}
.info-chip .ic-body .ic-val{font-size:11px;font-weight:700;color:var(--text)}
.ic-val.pdc-yes{color:var(--pdc)}.ic-val.pdc-no{color:var(--muted)}

.divider{border:none;border-top:1px solid var(--border);margin:8px 0}
.ct-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0}
.ct-label{font-size:9px;color:var(--muted);margin-bottom:2px;text-transform:uppercase;letter-spacing:0.4px}
.ct-name{font-size:12.5px;font-weight:600;color:var(--text)}
.call-btn{display:flex;align-items:center;gap:5px;background:var(--current-bg);border:1px solid rgba(90,149,119,0.35);color:var(--current);border-radius:20px;padding:7px 13px;font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap}
.action-btns{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.stmt-btn{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:5px;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:20px;padding:9px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:background 0.15s}
.stmt-btn:hover{background:var(--bg3);border-color:var(--text)}
.stmt-btn:active{background:var(--bg3)}.stmt-btn.loading{opacity:0.6;pointer-events:none}
.missing{font-size:11px;color:var(--overdue);background:var(--overdue-bg);border-radius:8px;padding:7px 10px;margin-top:6px}
.notes{margin-top:6px;font-size:10px;color:var(--muted);background:var(--card);border-radius:6px;padding:6px 9px;line-height:1.5;border:1px solid var(--border)}
.empty{text-align:center;padding:40px 14px;color:var(--muted);font-size:13px}

/* BOTTOM */
.bot{background:var(--bg2);border-top:1px solid var(--border);padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bot .bl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px}
.bot .bv{font-size:15px;font-weight:800;color:var(--text)}

/* FOLLOW-UP overlay UI */
.fu-modal{position:fixed;inset:0;background:rgba(45,36,25,0.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:14px}
.fu-modal-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;max-width:380px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 10px 30px rgba(45,36,25,0.18)}
.fu-modal h3{font-size:15px;margin-bottom:4px;color:var(--text)}
.fu-modal p.sub{color:var(--muted);font-size:11px;margin-bottom:14px}
.fu-btn-primary{padding:12px;background:var(--current);color:#fff;border:0;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.fu-btn-primary:disabled{opacity:0.4;cursor:not-allowed}
.fu-btn-secondary{padding:12px;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit}
.fu-op-pick{padding:14px;color:#fff;border:0;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;flex:1}
.fu-op-pick.j{background:var(--azaiba)} .fu-op-pick.d{background:var(--national)}
.fu-out{padding:11px 13px;background:var(--soft);border:1px solid var(--border);color:var(--text);border-radius:9px;font-size:13px;text-align:left;cursor:pointer;font-family:inherit;width:100%;transition:all 0.15s}
.fu-out:hover{border-color:var(--text)}
.fu-out.selected{border-color:var(--current);background:var(--current-bg);color:var(--current)}
.fu-input{width:100%;padding:10px;background:var(--soft);color:var(--text);border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:inherit}
.fu-last{font-size:10px;color:var(--muted);margin-top:5px;padding:5px 9px;background:var(--soft);border-radius:6px;display:inline-block;border:1px solid var(--border)}
.fu-last.broken{color:var(--overdue);background:var(--overdue-bg);border-color:rgba(196,69,54,0.25)}
.fu-last.stale-tag{color:var(--stale);background:var(--stale-bg);border-color:rgba(168,98,138,0.3)}
.fu-op-chip{font-size:10px;color:var(--muted);background:var(--card);padding:4px 9px;border-radius:12px;cursor:pointer;border:1px solid var(--border);font-weight:600}
.fu-op-chip:hover{border-color:var(--text)}

/* ── Toast notification ─────────────────────────────────────────── */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(16px);
  background:#2D2419;color:#FFD966;padding:10px 22px;border-radius:20px;font-size:13px;
  font-weight:600;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;
  z-index:9999;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.25);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── Email button ───────────────────────────────────────────────── */
.ct-act{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.em-btn{padding:7px 12px;border:none;border-radius:8px;background:#1E3560;color:#fff;
  font-size:12px;font-weight:600;cursor:pointer;letter-spacing:.2px;}
.em-btn:disabled{opacity:.6;}

/* ── Statement preview overlay ───────────────────────────────────── */
.preview-overlay{display:none;position:fixed;inset:0;z-index:9000;
  background:rgba(0,0,0,.55);overflow-y:auto;}
.preview-overlay.open{display:flex;align-items:flex-start;justify-content:center;padding:16px 8px 40px;}
.preview-sheet{background:#fff;border-radius:14px;width:100%;max-width:420px;
  box-shadow:0 8px 32px rgba(0,0,0,.3);overflow:hidden;}
.preview-hdr{display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;background:#1E3560;color:#fff;}
.preview-hdr-title{font-size:15px;font-weight:700;}
.preview-close{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;line-height:1;}
.preview-body{padding:14px 14px 6px;max-height:65vh;overflow-y:auto;}
.pv-co{font-size:11px;color:#888;margin-bottom:2px;}
.pv-name{font-size:17px;font-weight:700;color:#1E3560;margin-bottom:10px;}
.pv-kpis{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px;}
.pv-kpi{flex:1 1 28%;border-radius:8px;padding:7px 6px;text-align:center;}
.pv-kl{font-size:10px;opacity:.8;margin-bottom:2px;}
.pv-kv{font-size:12px;font-weight:700;}
.pv-sec{font-size:11px;font-weight:700;color:#555;margin:10px 0 4px;text-transform:uppercase;}
.pv-tbl{width:100%;border-collapse:collapse;font-size:11px;}
.pv-tbl th{background:#f0f0f0;padding:5px 4px;text-align:left;font-weight:600;}
.pv-tbl td{padding:5px 4px;border-bottom:1px solid #f0f0f0;vertical-align:middle;}
.pv-tbl tr.od td{background:#fff5f5;color:#c00;}
.pv-tbl input[type=checkbox]{width:14px;height:14px;cursor:pointer;accent-color:#1E3560;}
.preview-actions{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-top:1px solid #eee;}
.pv-pill{border:1.5px solid rgba(139,110,86,0.25);background:#F8F3EC;color:#8B7A65;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.15s}
.preview-cancel{flex:1;padding:11px;border:1px solid #ccc;border-radius:8px;
  background:#fff;font-size:14px;cursor:pointer;}
.preview-share{flex:2;padding:11px;border:none;border-radius:8px;
  background:#1E3560;color:#fff;font-size:14px;font-weight:700;cursor:pointer;}
.preview-share:disabled{opacity:.6;}

</style>
</head>
<body>
<div class="wrap">
<div class="hdr">
  <div class="hdr-top">
    <div class="hdr-title">Debtors <span>follow-up</span></div>
    <div class="updated">31 May 2026</div>
  </div>
  <div class="filter-row">
    <button class="pill t5" id="fu-t5-pill" onclick="FU.toggleT5(this)">⭐ Today's follow-up <span class="fu-count" id="fu-today-count">(5)</span></button>
    <button class="pill stale" id="fu-stale-pill" onclick="FU.toggleStale(this)">🟣 Stale <span class="fu-count" id="fu-stale-count">(0)</span></button>
    <button class="pill snoozed" id="fu-snoozed-pill" onclick="FU.toggleSnoozed(this)">📅 Scheduled <span class="fu-count" id="fu-snoozed-count">(0)</span></button>
  </div>
  <div class="filter-row">
    <button class="pill active all" data-f="co" data-v="ALL">All Companies</button>
    <button class="pill az"  data-f="co" data-v="AZAIBA">Azaiba</button>
    <button class="pill nat" data-f="co" data-v="NATIONAL">National</button>
    <button class="pill collect" id="fu-collect-pill" onclick="FU.toggleCollect(this)">📬 Collect <span class="fu-count" id="fu-collect-count">(0)</span></button>
  </div>
  <div class="filter-row-dd">
    <div class="dd-wrap">
      <button class="dd-trigger" id="dd-status-trigger" onclick="FU.toggleDD('status', event)">
        <span id="dd-status-label">Status: All</span><span class="caret">▼</span>
      </button>
      <div class="dd-menu" id="dd-status-menu">
        <button class="dd-item selected" data-f="status" data-v="ALL" data-label="All">All</button>
        <button class="dd-item" data-f="status" data-v="OVERDUE" data-label="🔴 Overdue">🔴 Overdue</button>
        <button class="dd-item" data-f="status" data-v="NOT_OVERDUE" data-label="🟢 Not Yet Due">🟢 Not Yet Due</button>
      </div>
    </div>
    <div class="dd-wrap">
      <button class="dd-trigger" id="dd-more-trigger" onclick="FU.toggleDD('more', event)">
        <span id="dd-more-label">More</span><span class="caret">▼</span>
      </button>
      <div class="dd-menu" id="dd-more-menu" style="min-width:210px">
        <div class="dd-section">Views</div>
        <button class="dd-item" id="dd-pdc-item" onclick="FU.togglePDC(this); FU.closeDD('more')">💳 PDC on hand</button>
        <div class="dd-divider"></div>
        <div class="dd-section">Segment</div>
        <button class="dd-item selected" data-f="seg" data-v="NORMAL" data-label="Normal only">Normal only</button>
        <button class="dd-item" data-f="seg" data-v="SISTER" data-label="+ Sister cos.">+ Sister cos.</button>
        <button class="dd-item" data-f="seg" data-v="ALL" data-label="Show all">Show all</button>
      </div>
    </div>
  </div>
</div>

<div class="kpi-strip">

      const fname=`Statement_${d.n.replace(/[^a-zA-Z0-9]/g,'_').replace(/_+/g,'_')}_${d.co}.pdf`;
      const blob=pdf.output('blob');
      const file=new File([blob],fname,{type:'application/pdf'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        navigator.share({files:[file],title:subject,text:body}).catch(()=>pdf.save(fname));
      }else{
        pdf.save(fname);
        window.open(`mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`,'_blank');
      }
    }catch(e){console.error(e);alert('Error: '+e.message);}
    btn.disabled=false; btn.textContent=`📧 Email ${c.person}`;
  },50);
}

// ── PDF GENERATION ────────────────────────────────────────────────────────────
function sendStmt(evt,cardId){
  evt.stopPropagation();
  const btn=evt.currentTarget;
  btn.classList.add('loading'); btn.textContent='⏳ Generating...';
  const v=vis(); const sts=['OVERDUE','DUE','COMING','CURRENT','BAD DEBT','COURT CASE'];
  const stMap={};
  sts.forEach(s=>{v.filter(d=>d.s===s).forEach((d,i)=>{stMap[`c${s.replace(/[\s]/g,'')}_${i}`]=d;});});
  const d=stMap[cardId];
  if(!d){btn.classList.remove('loading');btn.textContent='📄 Send Statement';return;}
  setTimeout(()=>{
    try{
      const pdf=buildPDF(d);
      const fname=`Statement_${d.n.replace(/[^a-zA-Z0-9]/g,'_').replace(/_+/g,'_')}_${d.co}.pdf`;
      const blob=pdf.output('blob');
      const file=new File([blob],fname,{type:'application/pdf'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        navigator.share({files:[file],title:`Account Statement — ${d.n}`,
          text:`Account statement for ${d.n} as of ${TODAY_STR}.`}).catch(()=>pdf.save(fname));
      }else{pdf.save(fname);}
    }catch(e){console.error(e);alert('PDF error: '+e.message);}
    btn.classList.remove('loading'); btn.textContent='📄 Send Statement';
  },50);
}

function buildPDF(d){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const PW=210,PH=297,LM=18,RM=18,W=PW-LM-RM;
  const co=CO[d.co]||CO['NATIONAL'];
  const CP=d.credit_period;

  const navy=[15,31,61],navy2=[30,53,96],red=[192,0,0],dgreen=[27,94,32],
        blue=[21,101,192],dgray=[89,89,89],mgray=[180,180,180],lgray=[242,242,242],
        white=[255,255,255],yel=[255,217,102],redl=[255,204,204],bluel=[219,234,254];

  const setF=(sz,style='normal',clr=[0,0,0])=>{
    doc.setFontSize(sz);doc.setFont('helvetica',style);doc.setTextColor(...clr);
  };
  const fmt_=v=>v.toFixed(3).replace(/\B(?=(\d{3})+(?!\d))/g,',');
  const coMeta=[co.cr,co.po,co.addr,co.vatin].filter(Boolean).join('  |  ');

  let y=14;

  setF(16,'bold',navy);doc.text(co.name,LM,y);y+=6;
  setF(8,'normal',dgray);doc.text(coMeta,LM,y);y+=4;
  doc.setDrawColor(...navy);doc.setLineWidth(0.8);doc.line(LM,y,PW-RM,y);y+=3;
  setF(13,'bold',navy);doc.text('STATEMENT OF ACCOUNT',LM,y+4);
  setF(9,'normal',dgray);doc.text('As of '+TODAY_STR,PW-RM,y+4,{align:'right'});y+=8;
  setF(7.5,'normal',dgray);
  doc.text('This is a computer-generated statement. For queries, please contact our accounts team.',LM,y);y+=4;
  doc.setDrawColor(...mgray);doc.setLineWidth(0.3);doc.line(LM,y,PW-RM,y);y+=5;

  const firstDate=d.inv.length>0?d.inv[0].date:'01 Jan 2026';
  setF(10,'bold',[0,0,0]);doc.text(`DEBTOR:  ${d.n}`,LM,y);
  setF(9,'normal',[0,0,0]);doc.text('Statement Date:  '+TODAY_STR,PW-RM,y,{align:'right'});y+=5;
  setF(9,'normal',dgray);
  doc.text(`Period:  ${firstDate} to ${TODAY_STR}  |  Credit Terms: ${CP} days`,LM,y);
  if(d.cn)doc.text(`Contact:  ${d.cp_name}  |  ${d.cn}`,PW-RM,y,{align:'right'});
  y+=8;

  const kpiC=[navy2,red,dgreen,blue,navy];
  const kpiL=['TOTAL OUTSTANDING','OVERDUE','NOT OVERDUE','PDC IN HAND','NET BALANCE'];
  const kpiV=[d.t,d.cp_ov,d.cp_not_ov,d.p,d.net];
  const bw=W/5;
  kpiC.forEach((clr,i)=>{
    const x=LM+i*bw;
    doc.setFillColor(...clr);doc.rect(x,y,bw,14,'F');
    if(i<4){doc.setDrawColor(...white);doc.setLineWidth(0.3);doc.line(x+bw,y,x+bw,y+14);}
    setF(7.5,'bold',white);doc.text(kpiL[i],x+bw/2,y+5,{align:'center'});
    const vc=i===4?yel:white;
    setF(9.5,'bold',vc);doc.text('OMR '+fmt_(kpiV[i]),x+bw/2,y+11,{align:'center'});
  });
  y+=18;
  setF(8,'normal',red);doc.text('■',LM,y);
  setF(8,'normal',dgray);doc.text(' Overdue (past credit terms)',LM+3,y);
  const lw1=doc.getTextWidth(' Overdue (past credit terms)')+8;
  setF(8,'normal',dgreen);doc.text('■',LM+lw1+3,y);
  setF(8,'normal',dgray);doc.text(' Not Overdue',LM+lw1+6,y);
  const lw2=doc.getTextWidth(' Not Overdue')+8;
  setF(8,'normal',blue);doc.text('■',LM+lw1+lw2+6,y);
  setF(8,'normal',dgray);doc.text(' PDC Received',LM+lw1+lw2+9,y);
  y+=7;

  const cw=[W*0.11,W*0.17,W*0.33,W*0.16,W*0.12,W*0.11];
  const cols=[LM]; for(let i=0;i<cw.length;i++) cols.push(cols[i]+cw[i]);
  const aln=['l','l','l','r','c','c'];
  const hdrs2=['Date','Reference No.','Party Name','Amount (OMR)','Due Date','Days OD'];
  const RH=6.5;

  const drawTxt=(txt,ci,yi,bold,clr)=>{
    const x=cols[ci],w2=cw[ci];
    setF(8.5,bold?'bold':'normal',clr||[0,0,0]);
    let disp=String(txt||'');
    if(ci===2){while(disp.length>3&&doc.getTextWidth(disp)>w2-4)disp=disp.slice(0,-1);}
    if(ci===4&&aln[ci]==='r'){doc.text(disp,cols[ci+1]-1,yi,{align:'right'});}
    else if(aln[ci]==='r'){doc.text(disp,cols[ci+1]-1,yi,{align:'right'});}
    else if(aln[ci]==='c'){doc.text(disp,x+w2/2,yi,{align:'center'});}
    else doc.text(disp,x+1,yi);
  };

  doc.setFillColor(...navy);doc.rect(LM,y,W,RH,'F');
  hdrs2.forEach((h,i)=>drawTxt(h,i,y+4.5,true,white));y+=RH;

  d.inv.forEach((inv,ri)=>{
    const isOd=inv.is_od;
    if(isOd){doc.setFillColor(...redl);}
    else if(ri%2===0){doc.setFillColor(...lgray);}
    else{doc.setFillColor(255,255,255);}
    doc.rect(LM,y,W,RH,'F');
    doc.setDrawColor(220,220,220);doc.setLineWidth(0.2);doc.line(LM,y+RH,PW-RM,y+RH);

    const invDateParts=inv.date.split('-');
    const months={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
    const invDateObj=new Date(2000+parseInt(invDateParts[2]),months[invDateParts[1]],parseInt(invDateParts[0]));
    const dueDateObj=new Date(invDateObj); dueDateObj.setDate(dueDateObj.getDate()+CP);
    const mns=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const dueDateStr=`${String(dueDateObj.getDate()).padStart(2,'0')}-${mns[dueDateObj.getMonth()]}-${String(dueDateObj.getFullYear()).slice(2)}`;

    const row=[inv.date,inv.ref,inv.party,fmt_(inv.amount),dueDateStr,
               isOd?String(inv.days_od):'—'];
    row.forEach((v,i)=>{
      const clr=(i===5&&isOd)?red:(i===5?dgray:null);
      drawTxt(v,i,y+4.5,i===5&&isOd,clr);
    });
    y+=RH;
    if(y>PH-50){doc.addPage();y=20;
      doc.setFillColor(...navy);doc.rect(LM,y,W,RH,'F');
      hdrs2.forEach((h,i)=>drawTxt(h,i,y+4.5,true,white));y+=RH;}
  });

  doc.setFillColor(...lgray);doc.rect(LM,y,W,RH,'F');
  doc.setDrawColor(...mgray);doc.setLineWidth(0.5);doc.line(LM,y,PW-RM,y);
  setF(9,'bold',[0,0,0]);
  doc.text('TOTAL OUTSTANDING',cols[2]+1,y+4.5);
  doc.text(fmt_(d.t),cols[4]-1,y+4.5,{align:'right'});
  y+=RH+5;

  if(y>PH-60){doc.addPage();y=20;}
  setF(9.5,'bold',navy);doc.text('POST-DATED CHEQUES (PDC) IN HAND',LM,y);y+=2;
  doc.setDrawColor(...navy);doc.setLineWidth(0.7);doc.line(LM,y,PW-RM,y);y+=5;

  if(d.pdc&&d.pdc.length>0){
    const pw2=[W*0.13,W*0.13,W*0.25,W*0.16,W*0.33];
    const pc=[LM]; for(let i=0;i<pw2.length;i++) pc.push(pc[i]+pw2[i]);
    const ph2=['Cheque Date','Cheque No.','Party Name','Amount (OMR)','Invoice Ref.'];
    const pa=['c','c','l','r','l'];
    doc.setFillColor(...blue);doc.rect(LM,y,W,RH,'F');
    ph2.forEach((h,i)=>{
      setF(8.5,'bold',white);
      if(pa[i]==='r') doc.text(h,pc[i+1]-1,y+4.5,{align:'right'});
      else if(pa[i]==='c') doc.text(h,(pc[i]+pc[i+1])/2,y+4.5,{align:'center'});
      else doc.text(h,pc[i]+1,y+4.5);
    });y+=RH;
    let pdcTot=0;
    d.pdc.forEach((p,ri)=>{
      pdcTot+=p.amount;
      if(ri%2===0){doc.setFillColor(...bluel);}else{doc.setFillColor(255,255,255);}
      doc.rect(LM,y,W,RH,'F');
      doc.setDrawColor(220,220,220);doc.setLineWidth(0.2);doc.line(LM,y+RH,PW-RM,y+RH);
      [p.cheque_date,p.cheque,p.party,fmt_(p.amount),p.inv_refs].forEach((v,i)=>{
        setF(8.5,'normal',[0,0,0]);
        let disp=String(v||'');
        if((i===2||i===4)&&doc.getTextWidth(disp)>pw2[i]-4){
          while(disp.length>3&&doc.getTextWidth(disp)>pw2[i]-4)disp=disp.slice(0,-1);}
        if(pa[i]==='r') doc.text(disp,pc[i+1]-1,y+4.5,{align:'right'});
        else if(pa[i]==='c') doc.text(disp,(pc[i]+pc[i+1])/2,y+4.5,{align:'center'});
        else doc.text(disp,pc[i]+1,y+4.5);
      });y+=RH;
      if(y>PH-40){doc.addPage();y=20;}
    });
    doc.setFillColor(...lgray);doc.rect(LM,y,W,RH,'F');
    doc.setDrawColor(...mgray);doc.setLineWidth(0.5);doc.line(LM,y,PW-RM,y);
    setF(9,'bold',[0,0,0]);doc.text('TOTAL PDC',pc[2]+1,y+4.5);
    doc.text(fmt_(pdcTot),pc[4]-1,y+4.5,{align:'right'});y+=RH+5;
  }else{
    setF(9,'normal',dgray);doc.text('No post-dated cheques on record for this account.',LM,y);y+=8;
  }

  if(y>PH-20){doc.addPage();y=20;}
  doc.setFillColor(...navy);doc.rect(LM,y,W,10,'F');
  setF(10,'bold',white);doc.text('NET BALANCE (Outstanding – PDC)',LM+4,y+6.5);
  setF(11,'bold',yel);doc.text('OMR '+fmt_(d.net),PW-RM-2,y+6.5,{align:'right'});

  const pages=doc.getNumberOfPages();
  for(let p=1;p<=pages;p++){
    doc.setPage(p);
    doc.setDrawColor(...mgray);doc.setLineWidth(0.3);doc.line(LM,PH-12,PW-RM,PH-12);
    setF(7,'normal',dgray);
    doc.text(`Page ${p} of ${pages}  |  ${co.name}  |  Printed: ${TODAY_STR}`,PW/2,PH-8,{align:'center'});
  }
  return doc;
}

document.querySelectorAll('[data-f]').forEach(b=>{
  b.addEventListener('click',()=>{
    const f=b.dataset.f,v=b.dataset.v;
    document.querySelectorAll(`[data-f="${f}"]`).forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    if(f==='status')aS=v; else if(f==='co')aC=v; else aG=v;
    // exit T5/Stale views when any data filter changes
    if(window.FU){ window.FU.exitViews(); }
    render();
  });
});
render();

<!-- ═══════════════════════════════════════════════════════════════════════
     FOLLOW-UP OVERLAY — operator picker, contact log, Today's 5, Stale view,
     log-outcome modal. Talks to Apps Script bridge to read/write contact log.
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
window.FU = (function(){
  const BRIDGE = 'https://script.google.com/macros/s/AKfycbyHMDmavU9hNOHZBEk_pEHqN8U7wSZx1o2ggQ3ejUTgXQD5bgluXYaDyaij7hq9IyMVRQ/exec';
  const LS_OP = 'fu_operator_v1';
  const STALE_DAYS = 10;
  let log = [];
  let op = localStorage.getItem(LS_OP);
  let t5Active = false, t5Set = null;
  let staleActive = false, staleSet = null;
  let pdcActive = false;
  let collectActive = false, collectSet = null;
  let snoozedActive = false, snoozedSet = null;

  function pickOp(){
    if(op) return;
    const m = document.createElement('div');
    m.className = 'fu-modal'; m.id = 'fu-op-modal';
    m.innerHTML = `
      <div class="fu-modal-card" style="text-align:center">
        <h3>Who's using this?</h3>
        <p class="sub">Saved on this device — tap the chip in the header to switch.</p>
        <div style="display:flex;gap:10px;margin-top:10px">
          <button class="fu-op-pick j" onclick="FU.setOp('Jabin')">I'm Jabin</button>
          <button class="fu-op-pick d" onclick="FU.setOp('Dad')">I'm Dad</button>
        </div>
      </div>`;
    document.body.appendChild(m);
  }
  function setOp(name){
    op = name; localStorage.setItem(LS_OP, name);
    const m = document.getElementById('fu-op-modal'); if(m) m.remove();
    renderOpChip();
  }
  function changeOp(){
    if(!confirm('Switch operator? (Currently: '+op+')')) return;
    localStorage.removeItem(LS_OP); op = null; pickOp();
  }
  function renderOpChip(){
    let c = document.getElementById('fu-op-chip');
    if(!c){
      const top = document.querySelector('.hdr-top'); if(!top) return;
      c = document.createElement('div'); c.id = 'fu-op-chip'; c.className = 'fu-op-chip'; c.onclick = changeOp;
      top.appendChild(c);
    }
    c.textContent = '👤 ' + (op || '?');
  }

  async function fetchLog(){
    try{
      const res = await fetch(BRIDGE + '?_=' + Date.now());
      const j = await res.json();
      if(j.ok && Array.isArray(j.log)) log = j.log;
    }catch(e){ console.warn('Bridge fetch failed', e); }
    refreshStaleCount();
    refreshCollectCount();
    refreshSnoozedCount();
    refreshTodayCount();
    decorate();
  }

  function fmtDate(str){
    if(!str) return '';
    const isDateOnly = /^\d{4}-\d{2}-\d{2}$/.test(str);
    const d = isDateOnly ? new Date(str+'T00:00:00') : new Date(str);
    if(isNaN(d)) return str;
    const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const mons=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return days[d.getDay()]+', '+d.getDate()+' '+mons[d.getMonth()]+' '+String(d.getFullYear()).slice(2);
  }

  function lastFor(name){
    if(!name) return null;
    const n = name.toLowerCase().trim();
    const rows = log.filter(e => (e.customer_name||'').toLowerCase().trim() === n)
                    .sort((a,b) => (b.timestamp_iso||'').localeCompare(a.timestamp_iso||''));
    return rows[0] || null;
  }

  function lastRealContactFor(name){
    if(!name) return null;
    const n = name.toLowerCase().trim();
    const rows = log.filter(e =>
      (e.customer_name||'').toLowerCase().trim() === n &&
      e.outcome !== 'snooze' && e.outcome !== 'unsnoozed'
    ).sort((a,b) => (b.timestamp_iso||'').localeCompare(a.timestamp_iso||''));
    return rows[0] || null;
  }

  function isSnoozedUntil(name){
    const l = lastFor(name);
    if(!l || !l.promise_date || l.outcome === 'paid' || l.outcome === 'unsnoozed') return null;
    const pd = new Date(l.promise_date + 'T00:00:00');
    if(isNaN(pd) || pd <= new Date()) return null;
    return pd;
  }

  function eligibleAll(){
    return (window.D || []).filter(d => {
      if(d.sg !== 'NORMAL') return false;
      if(d.cp_ov <= 0) return false;
      const l = lastFor(d.n);
      if(l && l.outcome === 'paid') return false;
      return true;
    });
  }

  function eligible(){
    return eligibleAll().filter(d => !isSnoozedUntil(d.n));
  }

  function computeT5(){
    const today = new Date();
    const scored = eligible().map(d => {
      const l = lastFor(d.n);
      let score = d.cp_ov * 1.0;
      if(l && l.promise_date && l.outcome === 'will_pay'){
        const pd = new Date(l.promise_date);
        if(!isNaN(pd) && pd < today) score *= 2.5;
      }
      if(l && l.timestamp_iso){
        const ago = (today - new Date(l.timestamp_iso)) / (1000*60*60*24);
        if(ago < 5) score *= 0.3;
      }
      if(d.cp_ov > 1000) score *= 1.5;
      return { name: d.n, score };
    });
    scored.sort((a,b) => b.score - a.score);
    const top5 = new Set(scored.slice(0,5).map(x => x.name));
    // Union with anyone whose scheduled follow-up date has arrived
    computeDueBack().forEach(n => top5.add(n));
    return top5;
  }

  // Customers whose most recent log is a scheduled follow-up (snooze or promise)
  // whose date is today or earlier, and they haven't been actioned since.
  function computeDueBack(){
    const today = new Date();
    return new Set(eligibleAll().filter(d => {
      const l = lastFor(d.n);
      if(!l || !l.promise_date) return false;
      if(l.outcome !== 'snooze' && l.outcome !== 'will_pay') return false;
      const pd = new Date(l.promise_date + 'T00:00:00');
      if(isNaN(pd)) return false;
      return pd <= today;
    }).map(d => d.n));
  }

  function computeStale(){
    const cutoff = new Date(Date.now() - STALE_DAYS*24*60*60*1000);
    return new Set(eligible().filter(d => {
      const l = lastRealContactFor(d.n);
      if(!l) return true;
      return new Date(l.timestamp_iso) < cutoff;
    }).map(d => d.n));
  }

  function computeSnoozed(){
    return new Set(eligibleAll().filter(d => isSnoozedUntil(d.n)).map(d => d.n));
  }

  function computeCollect(){
    const set = new Set();
    (window.D || []).forEach(d => {
      const n = d.n.toLowerCase().trim();
      const entries = log.filter(e =>
          (e.customer_name||'').toLowerCase().trim() === n &&
          ['pdc_ready','pdc_collected'].includes(e.outcome))
        .sort((a,b) => (b.timestamp_iso||'').localeCompare(a.timestamp_iso||''));
      if(entries.length && entries[0].outcome === 'pdc_ready') set.add(d.n);
    });
    return set;
  }

  function refreshCollectCount(){
    const n = computeCollect().size;
    const c = document.getElementById('fu-collect-count');
    if(c){ c.textContent = '(' + n + ')'; }
    const dc = document.getElementById('dd-collect-count');
    if(dc){ dc.textContent = '(' + n + ')'; }
  }

  function refreshSnoozedCount(){
    const c = document.getElementById('fu-snoozed-count');
    if(c){ c.textContent = '(' + computeSnoozed().size + ')'; }
  }

  function refreshTodayCount(){
    const c = document.getElementById('fu-today-count');
    if(c){ c.textContent = '(' + computeT5().size + ')'; }
  }

  function refreshStaleCount(){
    const c = document.getElementById('fu-stale-count');
    if(c){
      const n = computeStale().size;
      c.textContent = '(' + n + ')';
    }
  }

  function exitViews(){
    if(t5Active){ t5Active = false; t5Set = null; document.getElementById('fu-t5-pill').classList.remove('active'); }
    if(staleActive){ staleActive = false; staleSet = null; document.getElementById('fu-stale-pill').classList.remove('active'); }
    if(pdcActive){
      pdcActive = false;
      const pp = document.getElementById('fu-pdc-pill'); if(pp) pp.classList.remove('active');
      document.getElementById('root').style.display = '';
      document.getElementById('pdc-panel').style.display = 'none';
      const bot = document.querySelector('.bot'); if(bot) bot.style.display = '';
    }
    if(snoozedActive){
      snoozedActive = false; snoozedSet = null;
      const sp = document.getElementById('fu-snoozed-pill'); if(sp) sp.classList.remove('active');
    }
    if(collectActive){
      collectActive = false; collectSet = null;
      const cp = document.getElementById('fu-collect-pill'); if(cp) cp.classList.remove('active');
    }
  }

  function toggleT5(btn){
    const wasActive = t5Active;
    exitViews();
    if(!wasActive){
      t5Active = true; t5Set = computeT5(); btn.classList.add('active');
    }
    if(window.render) window.render();
    setTimeout(applyFilters, 50);
  }

  function toggleStale(btn){
    const wasActive = staleActive;
    exitViews();
    if(!wasActive){
      staleActive = true; staleSet = computeStale(); btn.classList.add('active');
    }
    if(window.render) window.render();
    setTimeout(applyFilters, 50);
  }

  function toggleSnoozed(btn){
    const wasActive = snoozedActive;
    exitViews();
    if(!wasActive){
      snoozedActive = true; snoozedSet = computeSnoozed(); btn.classList.add('active');
    }
    if(window.render) window.render();
    setTimeout(applyFilters, 50);
  }

  function unsnooze(name){
    if(!name) return;
    if(!confirm('Bring ' + name + ' back into today\'s follow-up now?')) return;
    const entry = {
      timestamp_iso: new Date().toISOString(),
      customer_name: name, operator: op, channel: '',
      action: 'unsnooze', outcome: 'unsnoozed',
      promise_date: '', amount_omr: '', notes: ''
    };
    fetch(BRIDGE, { method:'POST', headers:{'Content-Type':'text/plain;charset=UTF-8'}, body: JSON.stringify(entry) })
      .catch(()=>{});
    log.unshift(entry);
    refreshStaleCount(); refreshCollectCount(); refreshSnoozedCount(); refreshTodayCount();
    if(snoozedActive){ snoozedSet = computeSnoozed(); }
    if(window.render) window.render();
    setTimeout(()=>{ if(snoozedActive) applyFilters(); decorate(); }, 50);
  }

  function applyFilters(){
    const activeSet = t5Active ? t5Set : (staleActive ? staleSet : (snoozedActive ? snoozedSet : (collectActive ? collectSet : null)));
    if(!activeSet) return;
    document.querySelectorAll('.card').forEach(card => {
      const nameEl = card.querySelector('.card-name'); if(!nameEl) return;
      if(!activeSet.has(nameEl.textContent.trim())) card.style.display = 'none';
    });
    // also hide empty section headers
    document.querySelectorAll('.cards').forEach(grp => {
      const visible = Array.from(grp.children).some(c => c.style.display !== 'none');
      if(!visible){
        grp.style.display = 'none';
        const prev = grp.previousElementSibling;
        if(prev && prev.classList.contains('sec-hdr')) prev.style.display = 'none';
      }
    });
    // update KPI cards to reflect only the visible (T5/Stale) subset
    if(window.updateKPIs) window.updateKPIs(vis().filter(d => activeSet.has(d.n)));
  }

  function decorate(){
    const cutoff = Date.now() - STALE_DAYS*24*60*60*1000;
    const activeCollectSet = computeCollect();
    document.querySelectorAll('.card').forEach(card => {
      const nameEl = card.querySelector('.card-name'); if(!nameEl) return;
      const name = nameEl.textContent.trim();
      const l = lastFor(name);
      const left = card.querySelector('.card-left');
      const oldDec = left.querySelector('.fu-last'); if(oldDec) oldDec.remove();
      const oldSnz = left.querySelector('.fu-snooze-chip'); if(oldSnz) oldSnz.remove();
      const oldPrm = left.querySelector('.fu-promise-chip'); if(oldPrm) oldPrm.remove();

      const snoozeUntil = isSnoozedUntil(name);
      if(snoozeUntil){
        const snz = document.createElement('div');
        const isPromise = l && l.outcome === 'will_pay';
        snz.className = isPromise ? 'fu-promise-chip' : 'fu-snooze-chip';
        snz.textContent = (isPromise ? '⏳ Promised by ' : '📅 Follow up ') + fmtDate(l.promise_date);
        left.appendChild(snz);
      }
      if(l){
        const when = fmtDate(l.timestamp_iso);
        const who = l.operator || '?';
        const out = (l.outcome || l.action || 'contacted').replace(/_/g,' ');
        let broken = false, isStale = false, promiseText = '';
        if(l.promise_date && l.outcome === 'will_pay'){
          const pd = new Date(l.promise_date);
          if(!isNaN(pd) && pd < new Date()){
            broken = true; promiseText = ` · ⚠ promised ${fmtDate(l.promise_date)} — didn't`;
          } else if(!isNaN(pd)){ promiseText = ` · promised ${fmtDate(l.promise_date)}`; }
        }
        const lr = lastRealContactFor(name);
        if(lr && new Date(lr.timestamp_iso).getTime() < cutoff && !snoozeUntil) isStale = true;
        if(!lr && !snoozeUntil) isStale = true;
        const div = document.createElement('div');
        let cls = 'fu-last';
        if(broken) cls += ' broken';
        else if(isStale) cls += ' stale-tag';
        div.className = cls;
        div.textContent = `Last contacted: ${when} · ${who}`;
        left.appendChild(div);
      } else {
        // never touched — show stale tag if customer would be eligible
        const eligibleHere = (window.D||[]).some(d => d.n === name && d.sg === 'NORMAL' && d.cp_ov > 0);
        if(eligibleHere){
          const div = document.createElement('div');
          div.className = 'fu-last stale-tag';
          div.textContent = '🟣 never touched';
          left.appendChild(div);
        }
      }
      const detail = card.querySelector('.card-detail'); if(!detail) return;
      let actionBtns = detail.querySelector('.action-btns');
      if(!actionBtns){
        actionBtns = document.createElement('div'); actionBtns.className = 'action-btns';
        detail.appendChild(actionBtns);
      }
      if(!actionBtns.querySelector('.fu-log-btn')){
        const lb = document.createElement('button');
        lb.className = 'stmt-btn fu-log-btn'; lb.textContent = '📝 Log outcome';
        lb.onclick = (ev) => { ev.stopPropagation(); openLog(name); };
        actionBtns.appendChild(lb);
      }
      const oldChip = card.querySelector('.fu-collect-chip'); if(oldChip) oldChip.remove();
      if(activeCollectSet.has(name)){
        const pc = document.createElement('div'); pc.className = 'fu-collect-chip';
        pc.textContent = '📬 PDC ready to collect';
        const cardLeft = card.querySelector('.card-left'); if(cardLeft) cardLeft.appendChild(pc);
      }
      const oldUb = actionBtns.querySelector('.fu-unsnooze-btn'); if(oldUb) oldUb.remove();
      if(snoozeUntil){
        const ub = document.createElement('button');
        ub.className = 'fu-unsnooze-btn';
        ub.textContent = '🔓 Bring forward';
        ub.onclick = (ev) => { ev.stopPropagation(); FU.unsnooze(name); };
        actionBtns.appendChild(ub);
      }
      const oldCb = actionBtns.querySelector('.fu-pdc-collect-btn'); if(oldCb) oldCb.remove();
      if(collectActive && collectSet && collectSet.has(name)){
        const cb = document.createElement('button');
        cb.className = 'stmt-btn fu-pdc-collect-btn'; cb.textContent = '✅ Collected';
        cb.onclick = (ev) => { ev.stopPropagation(); openLog(name, 'pdc_collected'); };
        actionBtns.insertBefore(cb, actionBtns.firstChild);
      }
      if(!actionBtns.querySelector('.fu-hist-btn')){
        const hb = document.createElement('button');
        hb.className = 'stmt-btn fu-hist-btn'; hb.textContent = '📋 History';
        hb.onclick = (ev) => { ev.stopPropagation(); openHistory(name); };
        actionBtns.appendChild(hb);
      }
    });
    if(t5Active || staleActive || snoozedActive || collectActive) applyFilters();
  }

  let _ls = { action:'', outcome:'' };
  function openLog(name, preOutcome){
    if(!op){ pickOp(); return; }
    _ls = { action:'', outcome:'' };
    const m = document.createElement('div');
    m.className = 'fu-modal'; m.id = 'fu-log-modal';
    m.innerHTML = `
      <div class="fu-modal-card">
        <h3>Log contact — ${esc(name)}</h3>
        <p class="sub">Logging as <b>${esc(op)}</b></p>
        <div style="display:flex;flex-direction:column;gap:7px">
          <button class="fu-out" data-a="reminder_sent" data-o="sent">✉️ Sent WhatsApp/Email reminder</button>
          <button class="fu-out" data-a="called" data-o="no_answer">📵 Called — no answer</button>

        </div>
        <div id="fu-promise-row" style="display:none;margin-top:12px">
          <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">Promised pay date</label>
          <input type="date" id="fu-promise" class="fu-input">
        </div>
        <div id="fu-snooze-row" style="display:none;margin-top:12px">

          <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px">
            <button type="button" class="fu-snooze-preset" data-days="3">3 days</button>
            <button type="button" class="fu-snooze-preset" data-days="7">7 days</button>
            <button type="button" class="fu-snooze-preset" data-days="14">14 days</button>
          </div>
          <div style="display:flex;gap:8px;align-items:center">
            <input type="number" id="fu-snooze-days" class="fu-input" placeholder="Custom days" min="1" max="365" style="flex:1;margin-top:0">
            <span style="font-size:10px;color:var(--muted)">OR</span>
            <input type="date" id="fu-snooze-date" class="fu-input" style="flex:1;margin-top:0">
          </div>
        </div>
        <textarea id="fu-notes" class="fu-input" placeholder="Notes (optional)" style="margin-top:10px;min-height:54px;resize:vertical"></textarea>
        <div style="display:flex;gap:8px;margin-top:14px">
          <button class="fu-btn-secondary" style="flex:1" onclick="FU.closeLog()">Cancel</button>
          <button class="fu-btn-primary" style="flex:1" id="fu-save" disabled>Save</button>
        </div>
      </div>`;
    document.body.appendChild(m);
    m.querySelectorAll('.fu-out').forEach(b => {
      b.addEventListener('click', () => {
        m.querySelectorAll('.fu-out').forEach(x => x.classList.remove('selected'));
        b.classList.add('selected');
        _ls.action = b.dataset.a; _ls.outcome = b.dataset.o;
        document.getElementById('fu-promise-row').style.display = (b.dataset.o === 'will_pay') ? 'block' : 'none';
        document.getElementById('fu-pdc-amount-row').style.display = (b.dataset.o === 'pdc_ready') ? 'block' : 'none';
        document.getElementById('fu-snooze-row').style.display = (b.dataset.o === 'snooze') ? 'block' : 'none';
        const sv = document.getElementById('fu-save'); sv.disabled = false;
      });
    });
    // snooze preset chip selection
    m.querySelectorAll('.fu-snooze-preset').forEach(b => {
      b.addEventListener('click', () => {
        m.querySelectorAll('.fu-snooze-preset').forEach(x => x.classList.remove('selected'));
        b.classList.add('selected');
        document.getElementById('fu-snooze-days').value = b.dataset.days;
        document.getElementById('fu-snooze-date').value = '';
      });
    });
    const sdays = document.getElementById('fu-snooze-days');
    const sdate = document.getElementById('fu-snooze-date');
    if(sdays){ sdays.addEventListener('input', () => { m.querySelectorAll('.fu-snooze-preset').forEach(x => x.classList.remove('selected')); if(sdate) sdate.value = ''; }); }
    if(sdate){ sdate.addEventListener('change', () => { m.querySelectorAll('.fu-snooze-preset').forEach(x => x.classList.remove('selected')); if(sdays) sdays.value = ''; }); }
    document.getElementById('fu-save').onclick = () => saveLog(name);
    if(preOutcome){
      const pb = m.querySelector('[data-o="'+preOutcome+'"]');
      if(pb) setTimeout(() => pb.click(), 80);
    }
  }
  function closeLog(){ const m = document.getElementById('fu-log-modal'); if(m) m.remove(); }

  async function saveLog(name){
    const sv = document.getElementById('fu-save'); if(!sv || sv.disabled) return;
    sv.textContent = 'Saving…'; sv.disabled = true;
    let pDate = document.getElementById('fu-promise') ? document.getElementById('fu-promise').value : '';
    if(_ls.outcome === 'snooze'){
      const sd = document.getElementById('fu-snooze-date');
      const sdays = document.getElementById('fu-snooze-days');
      if(sd && sd.value){ pDate = sd.value; }
      else if(sdays && sdays.value && parseInt(sdays.value) > 0){
        const t = new Date(); t.setDate(t.getDate() + parseInt(sdays.value));
        pDate = t.toISOString().slice(0,10);
      }
    }
    if(_ls.outcome === 'snooze' && !pDate){
      sv.textContent = 'Pick days or date'; sv.disabled = false;
      return;
    }
    const entry = {
      timestamp_iso: new Date().toISOString(),
      customer_name: name, operator: op, channel: '',
      action: _ls.action, outcome: _ls.outcome,
      promise_date: pDate,
      amount_omr: (document.getElementById('fu-pdc-amount') ? document.getElementById('fu-pdc-amount').value.trim() : ''),
      notes: document.getElementById('fu-notes') ? document.getElementById('fu-notes').value : ''
    };
    try{
      await fetch(BRIDGE, { method:'POST', headers:{'Content-Type':'text/plain;charset=UTF-8'}, body: JSON.stringify(entry) });
      log.unshift(entry); closeLog(); refreshStaleCount(); refreshCollectCount(); refreshSnoozedCount(); refreshTodayCount(); decorate();
      if(entry.outcome === 'pdc_ready'){
        const dObj = (window.D||[]).find(x => x.n === name);
        const coName = dObj && window.CO && window.CO[dObj.co] ? window.CO[dObj.co].name : '';
        const amtText = entry.amount_omr ? 'OMR ' + parseFloat(entry.amount_omr).toFixed(3) : 'amount unknown';
        const msg = '📬 PDC ready to collect\n\nDebtor: ' + name + (coName ? ' ('+coName+')' : '') + '\nAmount: ' + amtText + '\n\nPlease collect when available.';
        navigator.clipboard.writeText(msg).catch(()=>{});
        if(window.showToast) showToast('📬 PDC alert copied — forward to Dad on WhatsApp');
      }
      if(collectActive){ collectSet = computeCollect(); if(window.render) window.render(); setTimeout(applyFilters, 50); }
    }catch(e){ sv.textContent = 'Error — retry'; sv.disabled = false; }
  }

  function esc(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function boot(){
    pickOp(); renderOpChip(); fetchLog();
    refreshSnoozedCount();
    refreshTodayCount();
    // auto-activate stale view on Sundays (day 0)
    if(new Date().getDay() === 0){
      setTimeout(() => {
        const btn = document.getElementById('fu-stale-pill');
        if(btn && computeStale().size > 0) toggleStale(btn);
      }, 800);
    }
    // re-decorate when #root changes
    const root = document.getElementById('root');
    if(root){ new MutationObserver(() => decorate()).observe(root, { childList: true, subtree: false }); }
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  function openHistory(name){
    const entries=log.filter(e=>(e.customer_name||'').toLowerCase().trim()===name.toLowerCase().trim())
                     .sort((a,b)=>(b.timestamp_iso||'').localeCompare(a.timestamp_iso||''));
    document.getElementById('historyTitle').textContent=name;
    const body=document.getElementById('historyBody');
    if(!entries.length){
      body.innerHTML='<div style="text-align:center;padding:32px 16px;color:var(--muted);font-size:13px">No log entries yet for this account.</div>';
    } else {
      body.innerHTML=entries.map(e=>{
        const when=fmtDate(e.timestamp_iso);
        const time=e.timestamp_iso?new Date(e.timestamp_iso).toLocaleTimeString('en-GB',{timeZone:'Asia/Muscat',hour:'2-digit',minute:'2-digit',hour12:false}):'';
        const who=e.operator||'?';
        const out=(e.outcome||e.action||'contacted').replace(/_/g,' ');
        const notes=e.notes||e.comment||'';
        const promise=e.promise_date||'';
        const broken=promise&&new Date(promise)<new Date()&&e.outcome!=='paid';
        return `<div style="padding:12px 0;border-bottom:1px solid var(--border)">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
            <span style="font-size:12px;font-weight:700;color:var(--text)">${when}${time?' · '+time:''}</span>
            <span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--current-bg);color:var(--current)">${who}</span>
          </div>
          <div style="font-size:12px;color:var(--text);margin-bottom:${(notes||promise)?'6px':'0'}">${out}${promise?` <span style="margin-left:6px;font-size:10px;padding:1px 7px;border-radius:20px;background:${broken?'var(--overdue-bg)':'var(--coming-bg)'};color:${broken?'var(--overdue)':'var(--coming)'}">⏰ promised ${fmtDate(promise)}${broken?' — overdue':''}</span>`:''}</div>
          ${notes?`<div style="font-size:12px;color:var(--muted);background:var(--soft);border-radius:8px;padding:8px 10px;line-height:1.5">${notes}</div>`:''}
        </div>`;
      }).join('');
    }
    document.getElementById('historyOv').classList.add('open');
  }

  function parseChequeDate(str){
    if(!str) return null;
    const mo={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
    const m=str.match(/(\d{2})-([A-Za-z]{3})-(\d{2})/);
    if(!m) return null;
    return new Date(2000+parseInt(m[3]), mo[m[2]], parseInt(m[1]));
  }

  function renderPDC(){
    const panel = document.getElementById('pdc-panel');
    const today = new Date(); today.setHours(0,0,0,0);
    const MONS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const fK=v=>'OMR '+v.toFixed(3).replace(/\B(?=(\d{3})+(?!\d))/g,',');
    const fA=v=>v.toFixed(3).replace(/\B(?=(\d{3})+(?!\d))/g,',');
    let entries=[];
    (window.D||[]).forEach(d=>{
      (d.pdc||[]).forEach(p=>{
        const dObj=parseChequeDate(p.cheque_date);
        entries.push({cheque_date:p.cheque_date,cheque:p.cheque,amount:p.amount||0,
          inv_refs:p.inv_refs||'',debtor:d.n,co:d.co,dateObj:dObj,isPast:dObj&&dObj<today});
      });
    });
    entries.sort((a,b)=>{
      if(!a.dateObj&&!b.dateObj)return 0;
      if(!a.dateObj)return 1; if(!b.dateObj)return -1;
      return a.dateObj-b.dateObj;
    });
    if(!entries.length){
      panel.innerHTML='<div style="padding:40px;text-align:center;color:var(--muted)">No PDC cheques on hand</div>';
      return;
    }
    const total=entries.reduce((s,e)=>s+e.amount,0);
    const hasPast=entries.some(e=>e.isPast);
    const debtors=new Set(entries.map(e=>e.debtor)).size;
    // Group by year-month key
    const grpMap={}, grpOrder=[];
    entries.forEach(e=>{
      const key=e.dateObj?`${e.dateObj.getFullYear()}-${e.dateObj.getMonth()}`:`unk`;
      const lbl=e.dateObj?`${MONS[e.dateObj.getMonth()]} ${e.dateObj.getFullYear()}`:`Unknown`;
      if(!grpMap[key]){grpMap[key]={lbl,rows:[],tot:0};grpOrder.push(key);}
      grpMap[key].rows.push(e); grpMap[key].tot+=e.amount;
    });
    let h='';
    // Summary bar
    h+=`<div style="background:var(--card);border-bottom:1px solid var(--border);padding:13px 16px;display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.7px;color:var(--muted);font-weight:600;margin-bottom:2px">PDC on hand</div>
        <div style="font-size:17px;font-weight:700;color:var(--text)">${fK(total)}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:12px;color:var(--muted)">${entries.length} cheque${entries.length!==1?'s':''}</div>
        <div style="font-size:10px;color:var(--muted);margin-top:2px">${debtors} debtor${debtors!==1?'s':''} · ${grpOrder.length} month${grpOrder.length!==1?'s':''}</div>
      </div>
    </div>`;
    // Past banner
    if(hasPast){
      const pc=entries.filter(e=>e.isPast).length;
      h+=`<div style="background:#FFF8EB;border-bottom:1px solid #F5D98C;padding:9px 16px;font-size:12px;color:#92650A;font-weight:500">⚠ ${pc} cheque${pc!==1?'s':''} past date — confirm if cleared</div>`;
    }
    // Month groups
    grpOrder.forEach(key=>{
      const g=grpMap[key];
      const gPast=g.rows.every(e=>e.isPast);
      h+=`<div>
        <div style="padding:7px 16px 6px;display:flex;justify-content:space-between;align-items:baseline;background:${gPast?'#FFF4DC':'var(--soft)'};border-top:1px solid ${gPast?'#F5D98C':'var(--border)'};border-bottom:1px solid ${gPast?'#F5D98C':'var(--border)'}">
          <span style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:${gPast?'#92650A':'var(--muted)'}">${g.lbl}${gPast?' · overdue':''}</span>
          <span style="font-size:11px;font-weight:600;color:${gPast?'#92650A':'var(--current)'}">${fK(g.tot)}</span>
        </div>`;
      g.rows.forEach(e=>{
        const day=e.dateObj?String(e.dateObj.getDate()).padStart(2,'0'):'?';
        const mon=e.dateObj?MONS[e.dateObj.getMonth()]:'?';
        const inv=e.inv_refs&&e.inv_refs!=='NOT,SUPPLIED'?` · inv: ${e.inv_refs}`:'';
        h+=`<div style="background:${e.isPast?'#FFFBF0':'var(--card)'};border-bottom:0.5px solid var(--border);padding:11px 16px;display:flex;align-items:flex-start;gap:12px">
          <div style="min-width:36px;text-align:center;padding-top:1px;flex-shrink:0">
            <div style="font-size:15px;font-weight:700;color:var(--text);line-height:1">${day}</div>
            <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:0.3px;margin-top:2px">${mon}</div>
          </div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:3px">
              <span style="font-size:12px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:155px">${e.debtor}</span>
              <span class="co-${e.co}">${e.co}</span>
              ${e.isPast?'<span style="font-size:9px;background:#FEF3C7;color:#92650A;border:1px solid #F5D98C;border-radius:8px;padding:1px 6px;font-weight:600">⚠ past</span>':''} 
            </div>
            <div style="font-size:11px;color:var(--muted)">#${e.cheque}${inv}</div>
          </div>
          <div style="font-size:13px;font-weight:600;color:var(--text);text-align:right;white-space:nowrap;padding-top:2px;flex-shrink:0">${fA(e.amount)}</div>
        </div>`;
      });
      h+='</div>';
    });
    // Grand total
    h+=`<div style="background:var(--card);border-top:1.5px solid var(--border);padding:13px 16px;display:flex;justify-content:space-between;align-items:center;margin-top:6px">
      <span style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.7px;color:var(--muted)">Total PDC on hand</span>
      <span style="font-size:15px;font-weight:700;color:var(--pdc)">${fK(total)}</span>
    </div>`;
    panel.innerHTML=h;
  }

  function togglePDC(btn){
    const wasActive = pdcActive;
    exitViews();
    if(!wasActive){
      pdcActive = true; btn.classList.add('active');
      document.getElementById('root').style.display = 'none';
      document.getElementById('pdc-panel').style.display = 'block';
      const bot = document.querySelector('.bot'); if(bot) bot.style.display = 'none';
      renderPDC();
    } else {
      if(window.render) window.render();
    }
  }

  function toggleCollect(btn){
    const wasActive = collectActive;
    exitViews();
    if(!wasActive){
      collectActive = true; collectSet = computeCollect(); btn.classList.add('active');
    }
    if(window.render) window.render();
    setTimeout(applyFilters, 50);
  }

    function toggleDD(which, ev){
    if(ev) ev.stopPropagation();
    const menu = document.getElementById('dd-' + which + '-menu');
    if(!menu) return;
    document.querySelectorAll('.dd-menu').forEach(m => { if(m !== menu) m.classList.remove('open'); });
    menu.classList.toggle('open');
  }
  function closeDD(which){
    const menu = document.getElementById('dd-' + which + '-menu');
    if(menu) menu.classList.remove('open');
  }
  document.addEventListener('click', (e) => {
    if(!e.target.closest('.dd-wrap')){
      document.querySelectorAll('.dd-menu').forEach(m => m.classList.remove('open'));
    }
  });
  document.addEventListener('click', (e) => {
    const it = e.target.closest('.dd-item[data-f]');
    if(!it) return;
    const f = it.dataset.f;
    const lbl = it.dataset.label || it.textContent.trim();
    if(f === 'status'){
      const t = document.getElementById('dd-status-label');
      if(t) t.textContent = 'Status: ' + lbl;
      const tr = document.getElementById('dd-status-trigger');
      if(tr) tr.classList.toggle('active', it.dataset.v !== 'ALL');
      document.querySelectorAll('#dd-status-menu .dd-item').forEach(x => x.classList.remove('selected'));
      it.classList.add('selected');
      closeDD('status');
    } else if(f === 'seg'){
      const isAll = it.dataset.v === 'NORMAL';
      const tr = document.getElementById('dd-more-trigger');
      if(tr) tr.classList.toggle('active', !isAll);
      document.querySelectorAll('#dd-more-menu .dd-item[data-f="seg"]').forEach(x => x.classList.remove('selected'));
      it.classList.add('selected');
      closeDD('more');
    }
  });

  return { setOp, changeOp, openLog, closeLog, saveLog, toggleT5, toggleStale, toggleSnoozed, exitViews, openHistory, togglePDC, toggleCollect, toggleDD, closeDD, unsnooze };
})();
</script>
